networks:
  protheus_network:
    name: protheus_network
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # INFRA & CONNECTIVITY TIER (Sempre iniciados)
  # ----------------------------------------------------------------------------
  license_server:
    build: ./license_server
    container_name: protheus_license
    networks:
      - protheus_network
    ports:
      - "${LICENSE_SERVER_PORT}:${LICENSE_SERVER_PORT}"
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/mem:/dev/mem"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always

  postgres_db:
    build: ./databases/postgres
    container_name: protheus_postgres
    profiles:
      - postgres
    environment:
      - POSTGRES_USER=${POSTGRES_ROOT_USER:-}
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_ROOT_USER:-}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - POSTGRES_INITDB_ARGS=--data-checksums -c shared_buffers=512MB -c synchronous_commit=off
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - protheus_network
    restart: always

  mssql_db:
    build: ./databases/mssql
    container_name: protheus_mssql
    profiles:
      - mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    ports:
      - "${MSSQL_PORT:-1433}:${MSSQL_PORT:-1433}"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - protheus_network
    restart: always

  oracle_db:
    build: ./databases/oracle
    container_name: protheus_oracle
    profiles:
      - oracle
    environment:
      - ORACLE_PWD=${ORACLE_ROOT_PASSWORD:-}
      - ORACLE_CHARACTERSET=WE8MSWIN1252
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    ports:
      - "${ORACLE_PORT:-1521}:${ORACLE_PORT:-1521}"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - protheus_network
    restart: always

  dbaccess:
    build: ./dbaccess
    container_name: protheus_dbaccess
    networks:
      protheus_network:
        aliases:
          - protheus_dbaccess # <-- Garante que o contêiner seja encontrado por este nome exato na rede
    env_file:
      - .env
      - .env.${SGBD}
    environment:
      - DB_TYPE=${DB_TYPE}
      - DB_SERVER=${DB_SERVER}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_SERVICE_NAME=${DB_SERVICE_NAME:-}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - LICENSE_SERVER_HOST=${LICENSE_SERVER}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
    ports:
      - "${DBACCESS_PORT}:${DBACCESS_PORT}"
    restart: always

  # ----------------------------------------------------------------------------
  # APPLICATION TIER: TOTVS APPSERVER CORE MASTER (Sempre iniciado)
  # ----------------------------------------------------------------------------
  appserver_core:
    build:
      context: .
      dockerfile: ./appserver/Dockerfile
    container_name: protheus_core
    networks:
      - protheus_network
    ports:
      - "${CORE_PORT_MULTI}:${CORE_PORT_MULTI}"
      - "${APP_MONITOR_PORT}:${APP_MONITOR_PORT}"
    environment:
      - ENV_NAME=${ENV_NAME}
      - DB_NAME=${DB_NAME}
      - DB_TYPE=${DB_TYPE}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - DBACCESS_SERVER=${DBACCESS_SERVER}
      - LICENSE_SERVER=${LICENSE_SERVER}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
      - APP_PORT_MULTI=${CORE_PORT_MULTI}
      - APP_MONITOR_PORT=${APP_MONITOR_PORT}
      - CUSTOM_RPO_NAME=${CUSTOM_RPO_NAME:-custom}
    volumes:
      - ./protheus/apo:/totvs/protheus/apo
      - protheus_system:/totvs/protheus/system
      - protheus_systemload:/totvs/protheus/systemload
      - protheus_data:/totvs/protheus/data
      - protheus_log:/totvs/protheus/log
      - ./protheus/system:/tmp/source_system:ro
      - ./protheus/systemload:/tmp/source_systemload:ro
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/mem:/dev/mem"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - dbaccess
    restart: always
    command: ["core"]

  # ----------------------------------------------------------------------------
  # APPLICATION TIER: SPECIALIST SERVICES (Perfis dedicados sob demanda)
  # ----------------------------------------------------------------------------
  appserver_rest:
    build:
      context: .
      dockerfile: ./appserver/Dockerfile
    container_name: protheus_rest
    profiles:
      - rest
    networks:
      - protheus_network
    ports:
      - "${REST_PORT_MULTI}:${REST_PORT_MULTI}"
      - "${REST_HTTP_PORT}:${REST_HTTP_PORT}"
    environment:
      - ENV_NAME=${ENV_NAME}
      - DB_NAME=${DB_NAME}
      - DB_TYPE=${DB_TYPE}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - DBACCESS_SERVER=${DBACCESS_SERVER}
      - LICENSE_SERVER=${LICENSE_SERVER}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
      - APP_PORT_MULTI=${REST_PORT_MULTI}
      - REST_HTTP_PORT=${REST_HTTP_PORT}
      - REST_PREP_ENV=${REST_PREP_ENV}
      - REST_INSTANCES=${REST_INSTANCES}
      - REST_URI=${REST_URI}
      - CUSTOM_RPO_NAME=${CUSTOM_RPO_NAME:-custom}
    volumes:
      - ./protheus/apo:/totvs/protheus/apo
      - protheus_system:/totvs/protheus/system
      - protheus_data:/totvs/protheus/data
      - protheus_log:/totvs/protheus/log
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/mem:/dev/mem"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    command: ["rest"]

  appserver_telnet:
    build:
      context: .
      dockerfile: ./appserver/Dockerfile
    container_name: protheus_telnet
    profiles:
      - telnet
    networks:
      - protheus_network
    ports:
      - "${TELNET_PORT_MULTI}:${TELNET_PORT_MULTI}"
      - "${TELNET_PORT}:${TELNET_PORT}"
    environment:
      - ENV_NAME=${ENV_NAME}
      - DB_NAME=${DB_NAME}
      - DB_TYPE=${DB_TYPE}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - DBACCESS_SERVER=${DBACCESS_SERVER}
      - LICENSE_SERVER=${LICENSE_SERVER}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
      - APP_PORT_MULTI=${TELNET_PORT_MULTI}
      - TELNET_PORT=${TELNET_PORT}
      - CUSTOM_RPO_NAME=${CUSTOM_RPO_NAME:-custom}
    volumes:
      - ./protheus/apo:/totvs/protheus/apo
      - protheus_system:/totvs/protheus/system
      - protheus_data:/totvs/protheus/data
      - protheus_log:/totvs/protheus/log
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/mem:/dev/mem"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always
    command: ["telnet"]

  # ----------------------------------------------------------------------------
  # APPLICATION TIER: AUTOMATED DEPLOY WORKER (MODO JOB CLI EFÊMERO)
  # ----------------------------------------------------------------------------
  appserver_worker:
    build:
      context: .
      dockerfile: ./appserver/Dockerfile
    container_name: protheus_worker
    profiles:
      - worker
    networks:
      - protheus_network
    environment:
      - ENV_NAME=${ENV_NAME}
      - DB_NAME=${DB_NAME}
      - DB_TYPE=${DB_TYPE}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - DBACCESS_SERVER=${DBACCESS_SERVER}
      - LICENSE_SERVER=${LICENSE_SERVER}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
      - CUSTOM_RPO_NAME=${CUSTOM_RPO_NAME:-custom}
    volumes:
      - ./protheus/apo:/totvs/protheus/apo
      - protheus_system:/totvs/protheus/system
      - protheus_log:/totvs/protheus/log
      - ./protheus/patches:/totvs/protheus/patches_queue
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/mem:/dev/mem"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["worker"]
  # ----------------------------------------------------------------------------
  # APPLICATION TIER: AUTOMATED DICTIONARY MIGRATOR (UPDDISTR JOB)
  # ----------------------------------------------------------------------------
  appserver_upddistr:
    build:
      context: .
      dockerfile: ./appserver/Dockerfile
    container_name: protheus_upddistr
    profiles:
      - upddistr
    networks:
      - protheus_network
    environment:
      - ENV_NAME=${ENV_NAME}
      - DB_NAME=${DB_NAME}
      - DB_TYPE=${DB_TYPE}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - DBACCESS_SERVER=${DBACCESS_SERVER}
      - LICENSE_SERVER=${LICENSE_SERVER}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
      - RPO_CUSTOM_NAME=${RPO_CUSTOM_NAME:-custom}
      # Parâmetros customizáveis para a carga do UPDDISTR
      - UPD_USER=${UPD_USER:-admin}
      - UPD_PASSWORD=${UPD_PASSWORD:-senha}
      - UPD_SIMULACAO=${UPD_SIMULACAO:-false}
      - UPD_EMPRESAS=${UPD_EMPRESAS:-"99"}
    volumes:
      - ./protheus/apo:/totvs/protheus/apo
      - protheus_system:/totvs/protheus/system
      - protheus_log:/totvs/protheus/log
      - ./protheus/systemload:/totvs/protheus/systemload
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/mem:/dev/mem"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["upddistr"]
  # ----------------------------------------------------------------------------
  # APPLICATION TIER: GITOPS ADVPL/TLPP CODE COMPILER LAYER
  # ----------------------------------------------------------------------------
  appserver_compiler:
    build:
      context: .
      dockerfile: ./appserver/Dockerfile
    container_name: protheus_compiler
    profiles:
      - compile
    networks:
      - protheus_network
    environment:
      - ENV_NAME=${ENV_NAME}
      - DB_NAME=${DB_NAME}
      - DB_TYPE=${DB_TYPE}
      - DBACCESS_PORT=${DBACCESS_PORT}
      - DBACCESS_SERVER=${DBACCESS_SERVER}
      - LICENSE_SERVER=${LICENSE_SERVER}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
      - RPO_CUSTOM_NAME=${RPO_CUSTOM_NAME:-custom}
    volumes:
      - ./protheus/apo:/totvs/protheus/apo
      - protheus_system:/totvs/protheus/system
      - protheus_log:/totvs/protheus/log
      - ./protheus/patches:/totvs/protheus/patches_queue # <-- MAPEADO PARA A FILA DE ENTRADA
      # 🔥 ADICIONE OS DIRETÓRIOS DE INCLUDES PERMANENTES AQUI:
      - ./protheus/includes/advpl:/totvs/protheus/includes/advpl
      - ./protheus/includes/tlpp:/totvs/protheus/includes/tlpp
      - ./protheus/includes/custom:/totvs/protheus/includes/custom
    cap_add:
      - SYS_RAWIO
    devices:
      - "/dev/mem:/dev/mem"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: ["compile"]

# ----------------------------------------------------------------------------
# PERSISTENT DATA TIERS (Bloco Restaurado Definitivamente)
# ----------------------------------------------------------------------------
volumes:
  pg_data:
  mssql_data:
  oracle_data:
  protheus_system:
  protheus_systemload:
  protheus_data:
  protheus_log: