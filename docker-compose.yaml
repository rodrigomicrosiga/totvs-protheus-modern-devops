services:
  # ----------------------------------------------------------------------------
  # DATA TIER: POSTGRESQL 16+
  # ----------------------------------------------------------------------------
  postgres_db:
    build: ./databases/postgres
    container_name: protheus_postgres
    profiles:
      - postgres
    environment:
      - POSTGRES_USER=${POSTGRES_ROOT_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ROOT_PASSWORD}
      - POSTGRES_DB=${POSTGRES_ROOT_USER}
      # Injeção direta e limpa para o escopo do container:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      # TUNING SEM QUEBRAR O SCRIPTD_INIT:
      - POSTGRES_INITDB_ARGS=--data-checksums -c shared_buffers=512MB -c synchronous_commit=off
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  # ----------------------------------------------------------------------------
  # DATA TIER: MS SQL SERVER 2022
  # ----------------------------------------------------------------------------
  sqlserver_db:
    build: ./databases/sqlserver
    container_name: protheus_sqlserver
    profiles:
      - sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    restart: always

  # ----------------------------------------------------------------------------
  # CONNECTIVITY TIER: TOTVS DBACCESS
  # ----------------------------------------------------------------------------
  dbaccess:
    build: ./dbaccess
    container_name: protheus_dbaccess
    profiles:
      - postgres
      - sqlserver
    environment:
      - DB_TYPE=${DB_TYPE}
      - DB_SERVER=${DB_SERVER}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - LICENSE_SERVER_HOST=${LICENSE_SERVER_HOST}
      - LICENSE_SERVER_PORT=${LICENSE_SERVER_PORT}
    ports:
      - "7890:7890"
    depends_on:
      postgres_db:
        condition: service_started
        required: false
      sqlserver_db:
        condition: service_started
        required: false
    restart: always

volumes:
  pg_data:
  sql_data: